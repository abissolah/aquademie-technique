# Développement local avec Docker (code monté en volume, DEBUG activé)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquademie_db}
      POSTGRES_USER: ${POSTGRES_USER:-aquademie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquademie_user} -d ${POSTGRES_DB:-aquademie_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "sed -i 's/\\r$$//' docker/entrypoint.sh && exec bash docker/entrypoint.sh"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-aquademie_db}
      POSTGRES_USER: ${POSTGRES_USER:-aquademie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_USE_WHITENOISE: ${DJANGO_USE_WHITENOISE:-True}
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "${WEB_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
