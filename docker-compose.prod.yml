# Production (Synology, serveur Linux, etc.)
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PG 18+ : monter sur /var/lib/postgresql (JAMAIS /data)
      # Volume renommé postgres18_data pour éviter les restes d'une ancienne config PG 16
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      # $$ = variables lues dans le conteneur (évite les soucis de substitution Compose sur Synology)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DJANGO_DEBUG: "False"
      DJANGO_USE_WHITENOISE: "True"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - ${CHEMIN_SFTP_HOST:-./caci_export}:${CHEMIN_SFTP:-/data/caci_export}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISHED_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  postgres18_data:
  media_data:
  static_data:
